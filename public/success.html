<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Welcome — IT Doc Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 3rem; text-align: center; max-width: 480px; }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 1rem; }
  h1 span { color: #2f81f7; }
  p { color: #8b949e; line-height: 1.6; margin-bottom: 2rem; }
  a { display: inline-block; background: #2f81f7; color: #fff; padding: 12px 32px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 15px; }
  a:hover { background: #388bfd; }
  .icon { font-size: 48px; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>Welcome to <span>ITDoc</span> Generator!</h1>
  <p>Your subscription is active. You now have unlimited access to generate professional IT documentation instantly.</p>
  <a href="/">Start Generating Docs →</a>
</div>
</body>
</html>
